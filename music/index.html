<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>sg darkfuture r-mix</title>
        <meta
            name="description"
            content="Web music player with the SG Darkfuture R-mix skin."
        />
        <meta name="viewport" content="width=275" />
        <meta name="theme-color" content="#000000" />
        <link rel="manifest" href="manifest.json" />
        <link rel="icon" type="image/png" href="icons/icon-192.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="application-name" content="SG Darkfuture" />
        <meta name="apple-touch-icon" href="icons/icon-192.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="SG Darkfuture" />
        <style>
            html, body {
                background: #000000;
                margin: 0;
                padding: 0;
            }
        </style>
    </head>

    <body>
        <div id="app" style="height: 100vh">
            <!-- Webamp will attempt to center itself within this div -->
        </div>
        <script type="module">
            import Webamp from "./js/webamp.js";
            const params = new URLSearchParams(window.location.search);
            const mediaURLs = params.getAll('m');
            const extraHeight = Math.max(0,Math.floor((innerHeight/innerWidth-1.3)*10));
            const extras = {};
            if (extraHeight > 0) {
                extras.windowLayout = {
                    main: {
                        position: { top: 0, left: 0 },
                    },
                    playlist: {
                        position: { top: 116, left: 0 },
                        // Number of additional sprites by which to expand the window.
                        size: { extraHeight, extraWidth: 0 },
                    },
                    equalizer: {
                        position: { top: 116*2 + extraHeight*29, left: 0 },
                    },
                };
            }
            const webamp = new Webamp({
                enableMediaSession: true,
                initialSkin: {
                    url: "sgdarkfuture.wsz",
                },
                ...extras,
                initialTracks: mediaURLs.length > 0 ? mediaURLs.map(url => ({url})) : [
                    { url: "music/ai_theme.m4a" },
                    { url: "music/chart_beats_loop.m4a" },
                    { url: "music/default.m4a" },
                    { url: "music/ident_loop.m4a" },
                    { url: "music/sales_loop.m4a" },
                    { url: "music/song_0.m4a" },
                    { url: "music/song_1.m4a" },
                    { url: "music/song_10.m4a" },
                    { url: "music/song_11.m4a" },
                    { url: "music/song_12.m4a" },
                    { url: "music/song_13.m4a" },
                    { url: "music/song_14.m4a" },
                    { url: "music/song_15.m4a" },
                    { url: "music/song_16.m4a" },
                    { url: "music/song_17.m4a" },
                    { url: "music/song_18.m4a" },
                    { url: "music/song_19.m4a" },
                    { url: "music/song_2.m4a" },
                    { url: "music/song_20.m4a" },
                    { url: "music/song_21.m4a" },
                    { url: "music/song_22.m4a" },
                    { url: "music/song_23.m4a" },
                    { url: "music/song_24.m4a" },
                    { url: "music/song_25.m4a" },
                    { url: "music/song_26.m4a" },
                    { url: "music/song_27.m4a" },
                    { url: "music/song_28.m4a" },
                    { url: "music/song_29.m4a" },
                    { url: "music/song_3.m4a" },
                    { url: "music/song_30.m4a" },
                    { url: "music/song_31.m4a" },
                    { url: "music/song_32.m4a" },
                    { url: "music/song_33.m4a" },
                    { url: "music/song_34.m4a" },
                    { url: "music/song_4.m4a" },
                    { url: "music/song_5.m4a" },
                    { url: "music/song_6.m4a" },
                    { url: "music/song_7.m4a" },
                    { url: "music/song_8.m4a" },
                    { url: "music/song_9.m4a" },
                    { url: "music/wait_loop.m4a" },
                ],
            });
            const originalTitle = document.title;
            webamp.onTrackDidChange((track) => {
                if (track == null) {
                    document.title = originalTitle;
                } else {
                    document.title = `${track.metaData.title ?? "Unnamed song"} - ${track.metaData.artist ?? "Unknown artist"}`;
                }
            });

            // Returns a promise indicating when it's done loading.
            webamp.renderWhenReady(document.getElementById("app")).then(() => window.scroll(0,0));
        </script>
        <script>
            // Register service worker for offline support
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js')
                        .then((registration) => {
                            console.log('ServiceWorker registered:', registration.scope);
                        })
                        .catch((error) => {
                            console.log('ServiceWorker registration failed:', error);
                        });
                });
            }
        </script>
    </body>
</html>
